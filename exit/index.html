<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON Formatter was removed</title>
<style>
  :root {
    --bg: #ffffff; --bg2: #f4f5f7; --fg: #24292f; --muted: #68717b;
    --line: #d8dde3; --accent: #1f7a5c; --on-accent: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16191d; --bg2: #1e2227; --fg: #dbe0e5; --muted: #848d97;
      --line: #30363d; --accent: #63c9a4; --on-accent: #16191d;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 56px 24px 80px; }
  .logo {
    display: inline-grid; place-items: center; width: 44px; height: 44px;
    border-radius: 11px; background: var(--muted); color: var(--bg);
    font-family: ui-monospace, Menlo, monospace; font-size: 17px; font-weight: 600;
    margin-inline-end: 14px; vertical-align: middle;
  }
  h1 { font-size: 30px; line-height: 1.25; margin: 0 0 10px; }
  .sub { color: var(--muted); font-size: 17px; margin: 0 0 30px; }
  fieldset { border: 0; padding: 0; margin: 0 0 18px; }
  legend { font-weight: 600; font-size: 18px; margin-bottom: 14px; padding: 0; }
  .opt {
    display: flex; gap: 12px; align-items: flex-start;
    border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px; cursor: pointer;
  }
  .opt:hover { border-color: var(--accent); }
  .opt:has(input:checked) { border-color: var(--accent); background: var(--bg2); }
  .opt input { margin-top: 4px; accent-color: var(--accent); }
  textarea {
    width: 100%; min-height: 90px; resize: vertical;
    font: 15px/1.5 inherit; font-family: inherit;
    color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    margin-bottom: 18px;
  }
  textarea:focus-visible, .opt input:focus-visible { outline: 2px solid var(--accent); }
  button {
    background: var(--accent); color: var(--on-accent); border: 0;
    font: 600 16px/1 inherit; padding: 13px 26px; border-radius: 10px; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .privacy { color: var(--muted); font-size: 13.5px; margin-top: 16px; }
  #thanks { display: none; }
  #thanks h1 { color: var(--accent); }
  .shown { display: block !important; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <div id="survey">
    <h1><span class="logo">{&hairsp;}</span><span data-i18n="title">JSON Formatter was removed</span></h1>
    <p class="sub" data-i18n="sub">Sorry to see you go. One quick question — it really helps us improve.</p>

    <form id="f">
      <fieldset>
        <legend data-i18n="q">Why did you uninstall it?</legend>
        <label class="opt"><input type="radio" name="reason" value="broken"><span data-i18n="oBroken">Something didn’t work or was buggy</span></label>
        <label class="opt"><input type="radio" name="reason" value="missing-features"><span data-i18n="oMissing">It’s missing features I need</span></label>
        <label class="opt"><input type="radio" name="reason" value="found-better"><span data-i18n="oBetter">I found a better alternative</span></label>
        <label class="opt"><input type="radio" name="reason" value="site-interference"><span data-i18n="oSites">It got in the way on some sites</span></label>
        <label class="opt"><input type="radio" name="reason" value="accidental"><span data-i18n="oAccident">Installed by accident / was just trying it</span></label>
        <label class="opt"><input type="radio" name="reason" value="other"><span data-i18n="oOther">Other</span></label>
      </fieldset>
      <textarea id="details" data-i18n-ph="detailsPh" placeholder="Tell us more — optional, but very helpful"></textarea>
      <button type="submit" id="send" disabled data-i18n="send">Send</button>
      <p class="privacy" data-i18n="privacy">Anonymous and voluntary — only the answer above is sent, nothing else.</p>
    </form>
  </div>

  <div id="thanks">
    <h1 data-i18n="thanksH">Thank you!</h1>
    <p class="sub" data-i18n="thanksP">Your answer was recorded. You can close this tab now.</p>
  </div>

</div>
<script src="i18n.js"></script>
<script>
  // --- Google Sheet: URL веб-приложения Apps Script (см. apps-script.gs рядом).
  // Пусто — отправка выключена, страница всё равно показывает «спасибо».
  const ENDPOINT = 'https://script.google.com/macros/s/AKfycby88pVMHP1xJeze_X4TRYIorVkWl1-_cXsMBkgj8xF71QSfG0Z0Vo-WS0yypD34F7Eu/exec';

  // --- локализация: тот же механизм, что на welcome-странице
  (function () {
    const norm = (l) => l.toLowerCase().replace('-', '_');
    const pick = () => {
      const q = new URLSearchParams(location.search).get('lang');
      const cand = [q, ...(navigator.languages || [navigator.language])].filter(Boolean);
      for (const c of cand.map(norm)) {
        if (I18N[c]) return c;
        const base = c.split('_')[0];
        if (base === 'zh') return 'zh_cn';
        if (base === 'pt') return c === 'pt_pt' ? 'pt_pt' : 'pt_br';
        if (base === 'es') return c === 'es' || c === 'es_es' ? 'es' : 'es_419';
        if (I18N[base]) return base;
      }
      return null;
    };
    const lang = pick();
    if (!lang) return;
    const t = I18N[lang];
    document.documentElement.lang = lang.replace('_', '-');
    if (lang === 'ar' || lang === 'he') document.documentElement.dir = 'rtl';
    for (const el of document.querySelectorAll('[data-i18n]')) {
      if (t[el.dataset.i18n]) el.textContent = t[el.dataset.i18n];
    }
    const ta = document.querySelector('[data-i18n-ph]');
    if (t[ta.dataset.i18nPh]) ta.placeholder = t[ta.dataset.i18nPh];
    document.title = t.pageTitle || document.title;
  })();

  // --- отправка ответа в Google-таблицу (Apps Script, no-cors)
  const form = document.getElementById('f');
  const send = document.getElementById('send');
  form.addEventListener('change', () => {
    send.disabled = !form.querySelector('input[name="reason"]:checked');
  });
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const reason = form.querySelector('input[name="reason"]:checked')?.value;
    if (!reason) return;
    send.disabled = true;
    if (ENDPOINT) {
      const body = new URLSearchParams({
        reason,
        details: document.getElementById('details').value.trim().slice(0, 2000),
        lang: document.documentElement.lang || 'en',
      });
      // Без await: у Apps Script холодный старт до нескольких секунд, ждать
      // нечего (no-cors — ответ всё равно не читается). keepalive доставит
      // запрос, даже если пользователь сразу закроет вкладку.
      fetch(ENDPOINT, { method: 'POST', mode: 'no-cors', keepalive: true, body }).catch(() => {});
    }
    document.getElementById('survey').classList.add('hidden');
    document.getElementById('thanks').classList.add('shown');
  });
</script>
</body>
</html>
